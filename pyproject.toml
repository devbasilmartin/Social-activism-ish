[project]
name = "botlab"
version = "0.1.0"
description = "Demonstrates how easily LLM bots can produce manipulative political comments, with every technique annotated."
requires-python = ">=3.10"
dependencies = ["anthropic", "pydantic>=2", "playwright"]

[project.optional-dependencies]
post = ["praw"]

[project.scripts]
botlab = "botlab.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["botlab"]

[tool.setuptools.package-data]
botlab = ["profiles.toml"]
